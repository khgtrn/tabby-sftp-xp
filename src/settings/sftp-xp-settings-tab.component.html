<div class="settings-tab">
  <header class="settings-heading">
    <div class="settings-icon"><i class="fas fa-server"></i></div>
    <div>
      <h2>SFTP XP</h2>
      <p>Customize the appearance and behavior of the file manager.</p>
    </div>
  </header>

  <section class="settings-card">
    <div class="section-title"><i class="fas fa-palette"></i><span>Appearance</span></div>
    <div class="form-line">
      <div class="header">
        <label class="title" for="sftp-xp-theme">Color theme</label>
        <div class="description">Apply the theme to Explorer, Editor, and dialogs.</div>
      </div>
      <select
        id="sftp-xp-theme"
        class="form-select control-medium"
        [(ngModel)]="config.store.sftpXp.theme"
        (ngModelChange)="changeTheme($event)"
      >
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </div>
    <div class="form-line">
      <div class="header">
        <label class="title" for="sftp-xp-icons">Icon style</label>
        <div class="description">Use category colors or a uniform monochrome style.</div>
      </div>
      <select
        id="sftp-xp-icons"
        class="form-select control-medium"
        [(ngModel)]="config.store.sftpXp.iconStyle"
        (ngModelChange)="save()"
      >
        <option value="colored">Colored</option>
        <option value="mono">Monochrome</option>
      </select>
    </div>
  </section>

  <section class="settings-card">
    <div class="section-title"><i class="fas fa-code"></i><span>Editor</span></div>
    <div class="form-line">
      <div class="header">
        <label class="title" for="editor-theme">Theme</label>
        <div class="description">Use the default app theme or a dedicated editor theme.</div>
      </div>
      <select id="editor-theme" class="form-select control-medium"
        [(ngModel)]="config.store.sftpXp.editor.theme" (ngModelChange)="save()">
        <option *ngFor="let theme of editorThemes" [value]="theme.value">{{ theme.label }}</option>
      </select>
    </div>
    <label class="switch-line">
      <span><strong>Minimap</strong><small>Show the code overview on the editor edge.</small></span>
      <input type="checkbox" [(ngModel)]="config.store.sftpXp.editor.minimap"
        (ngModelChange)="save()" />
    </label>
    <div class="form-line">
      <div class="header"><label class="title" for="editor-font-family">Font family</label></div>
      <input id="editor-font-family" type="text" class="form-control control-wide"
        [(ngModel)]="config.store.sftpXp.editor.fontFamily" (ngModelChange)="scheduleSave()" />
    </div>
    <div class="form-grid editor-number-grid">
      <label class="number-field">Font size
        <input type="number" min="8" max="40" class="form-control"
          [(ngModel)]="config.store.sftpXp.editor.fontSize" (change)="save()" />
      </label>
      <label class="number-field">Line height
        <input type="number" min="8" max="80" class="form-control"
          [(ngModel)]="config.store.sftpXp.editor.lineHeight" (change)="save()" />
      </label>
      <label class="number-field">Letter spacing
        <input type="number" min="-2" max="10" step="0.1" class="form-control"
          [(ngModel)]="config.store.sftpXp.editor.letterSpacing" (change)="save()" />
      </label>
    </div>
  </section>

  <section class="settings-card">
    <div class="section-title"><i class="fas fa-folder-open"></i><span>Folders</span></div>
    <div class="form-line">
      <div class="header">
        <label class="title" for="download-folder">Default download folder</label>
      </div>
      <div class="input-group control-wide">
        <input
          id="download-folder"
          type="text"
          class="form-control"
          [(ngModel)]="config.store.sftpXp.defaultDownloadFolder"
          (ngModelChange)="scheduleSave()"
        />
        <button
          class="btn btn-outline-secondary"
          title="Select folder"
          (click)="pickDownloadFolder()"
        >
          <i class="fas fa-folder"></i>
        </button>
      </div>
    </div>
    <div class="form-line">
      <div class="header"><label class="title" for="temp-folder">Temporary folder</label></div>
      <div class="input-group control-wide">
        <input
          id="temp-folder"
          type="text"
          class="form-control"
          [(ngModel)]="config.store.sftpXp.tempFolder"
          (ngModelChange)="scheduleSave()"
        />
        <button class="btn btn-outline-secondary" title="Select folder" (click)="pickTempFolder()">
          <i class="fas fa-folder"></i>
        </button>
      </div>
    </div>
  </section>

  <section class="settings-card">
    <div class="section-title"><i class="fas fa-sliders-h"></i><span>Behavior</span></div>
    <div class="form-grid">
      <label class="number-field">
        Maximum cache size (MB)
        <input
          type="number"
          min="0"
          class="form-control"
          [(ngModel)]="config.store.sftpXp.maxCacheSizeMB"
          (change)="save()"
        />
      </label>
      <label class="number-field">
        Open file size limit (MB)
        <input
          type="number"
          min="0"
          class="form-control"
          [(ngModel)]="config.store.sftpXp.openFileSizeLimitMB"
          (change)="save()"
        />
      </label>
    </div>
    <label class="switch-line">
      <span>
        <strong>Show hidden files</strong>
        <small>Show entries whose names begin with a dot.</small>
      </span>
      <input
        type="checkbox"
        [(ngModel)]="config.store.sftpXp.showHiddenFiles"
        (ngModelChange)="save()"
      />
    </label>
  </section>
</div>
