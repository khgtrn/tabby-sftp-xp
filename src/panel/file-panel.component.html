<div #panelRoot class="file-panel" tabindex="0" (keydown)="onPanelKeydown($event)">
  <div class="panel-title">{{ side === 'remote' ? 'Remote' : 'Local' }}</div>

  <div class="toolbar">
    <button
      class="btn btn-sm history-button"
      [disabled]="!canGoBack()"
      (click)="goBack()"
      title="Back"
    >
      <i class="fas fa-arrow-left"></i>
    </button>
    <button
      class="btn btn-sm history-button"
      [disabled]="!canGoForward()"
      (click)="goForward()"
      title="Forward"
    >
      <i class="fas fa-arrow-right"></i>
    </button>
    <button class="btn btn-sm" (click)="goUp()" title="Parent directory">
      <i class="fas fa-arrow-up"></i>
    </button>
    <button class="btn btn-sm" (click)="refresh()" title="Refresh">
      <i class="fas fa-sync"></i>
    </button>
    <button class="btn btn-sm" (click)="goHome()" title="Home">
      <i class="fas fa-home"></i>
    </button>
    <button class="btn btn-sm" (click)="openBookmarks()" title="Bookmarks">
      <i class="fas fa-star"></i>
    </button>
    <button class="btn btn-sm" (click)="addCurrentPathBookmark()" title="Bookmark this path">
      <i class="fas fa-plus"></i>
    </button>
  </div>

  <div class="path-bar">
    <button
      class="btn btn-sm filter-button"
      [class.filter-button--active]="showFilter"
      (click)="toggleFilter()"
      title="Filter"
    >
      <i class="fas fa-filter"></i>
    </button>
    <sftp-xp-path-input
      *ngIf="editingPath !== null; else pathLabel"
      class="path-input path-input--compact"
      [fs]="fs"
      [value]="editingPath"
      (valueChange)="editingPath = $event"
      [autofocus]="true"
      (confirm)="confirmPath()"
      (cancel)="cancelPathEdit()"
      (inputBlur)="confirmPath()"
    ></sftp-xp-path-input>
    <ng-template #pathLabel>
      <div class="path-label" (click)="editPath()">{{ path }}</div>
    </ng-template>
  </div>

  <div class="filter-bar" *ngIf="showFilter">
    <input
      #filterInput
      type="text"
      class="form-control form-control-sm"
      placeholder="Filter..."
      [(ngModel)]="filterText"
      (ngModelChange)="onFilterChange()"
    />
  </div>

  <div
    #fileList
    class="file-list"
    [class.file-list--drag-over]="isListDropTarget"
    (click)="onFileListClick($event)"
    (mousedown)="onFileListMouseDown($event)"
    (contextmenu)="showEmptyAreaMenu($event)"
    (dragover)="onListDragOver($event)"
    (dragleave)="onListDragLeave()"
    (drop)="onListDrop($event)"
  >
    <div class="file-list-header" *ngIf="filteredEntries.length">
      <span
        class="file-name-column sortable-column"
        [class.sortable-column--active]="sortKey === 'name'"
        (click)="setSort('name')"
      >
        Name <i [class]="getSortIcon('name')"></i>
      </span>
      <span
        class="file-modified-column sortable-column"
        [class.sortable-column--active]="sortKey === 'mtime'"
        (click)="setSort('mtime')"
      >
        Modified <i [class]="getSortIcon('mtime')"></i>
      </span>
      <span class="file-permissions-column">Permissions</span>
      <span
        class="file-size-column sortable-column"
        [class.sortable-column--active]="sortKey === 'size'"
        (click)="setSort('size')"
      >
        <i [class]="getSortIcon('size')"></i> Size
      </span>
    </div>
    <div
      *ngFor="let entry of filteredEntries"
      class="file-row"
      draggable="true"
      [class.file-row--cut]="isCut(entry)"
      [class.file-row--selected]="isSelected(entry)"
      [class.file-row--dragging]="draggingPaths.has(entry.path)"
      [class.file-row--drag-over]="dragOverEntryPath === entry.path"
      (click)="onEntryClick($event, entry)"
      (dblclick)="open(entry)"
      (contextmenu)="showEntryMenu(entry, $event)"
      (dragstart)="onEntryDragStart($event, entry)"
      (dragend)="onEntryDragEnd()"
      (dragover)="onEntryDragOver($event, entry)"
      (dragleave)="onEntryDragLeave(entry)"
      (drop)="onEntryDrop($event, entry)"
    >
      <i [class]="getIcon(entry)"></i>
      <span class="file-name">
        {{ entry.name }}<ng-container *ngIf="entry.linkTarget">
          <span class="file-link-arrow">&nbsp;&nbsp;&nbsp;-&gt;&nbsp;&nbsp;&nbsp;</span>
          <span class="file-link-target">{{ entry.linkTarget }}</span>
        </ng-container>
      </span>
      <span class="file-modified">{{ entry.mtime | date: 'yyyy-MM-dd HH:mm:ss' }}</span>
      <span class="file-permissions">{{ getPermissions(entry) }}</span>
      <span class="file-size">{{ entry.isDirectory ? '' : entry.size + ' B' }}</span>
    </div>
    <div *ngIf="!loading && !filteredEntries.length" class="text-muted p-2">(empty)</div>
    <div class="file-list-loading" *ngIf="loading">
      <span class="file-list-loading-badge"><i class="fas fa-spinner fa-spin"></i></span>
    </div>
  </div>
</div>
