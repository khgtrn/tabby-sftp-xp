<div #panelRoot class="file-panel" tabindex="0" (keydown)="onPanelKeydown($event)">
  <div class="toolbar">
    <button
      class="btn btn-sm history-button"
      [disabled]="!canGoBack()"
      (click)="goBack()"
      title="Back"
    >
      <i class="fas fa-arrow-left"></i>
    </button>
    <button
      class="btn btn-sm history-button"
      [disabled]="!canGoForward()"
      (click)="goForward()"
      title="Forward"
    >
      <i class="fas fa-arrow-right"></i>
    </button>
    <button class="btn btn-sm" (click)="goUp()" title="Parent directory">
      <i class="fas fa-arrow-up"></i>
    </button>
    <button class="btn btn-sm" (click)="refresh()" title="Refresh">
      <i class="fas fa-sync"></i>
    </button>
    <button class="btn btn-sm" (click)="goHome()" title="Home">
      <i class="fas fa-home"></i>
    </button>
    <button class="btn btn-sm" (click)="openBookmarks()" title="Bookmarks">
      <i class="fas fa-star"></i>
    </button>
    <button class="btn btn-sm" (click)="addCurrentPathBookmark()" title="Bookmark this path">
      <i class="fas fa-plus"></i>
    </button>
    <button class="btn btn-sm" (click)="toggleFilter()" title="Filter">
      <i class="fas fa-filter"></i>
    </button>
  </div>

  <div class="path-bar">
    <input
      *ngIf="editingPath !== null; else pathLabel"
      type="text"
      class="form-control form-control-sm"
      [(ngModel)]="editingPath"
      (keydown.enter)="confirmPath()"
      (blur)="confirmPath()"
      autofocus
    />
    <ng-template #pathLabel>
      <div class="path-label" (click)="editPath()">{{ path }}</div>
    </ng-template>
  </div>

  <div class="filter-bar" *ngIf="showFilter">
    <input
      #filterInput
      type="text"
      class="form-control form-control-sm"
      placeholder="Filter..."
      [(ngModel)]="filterText"
      (ngModelChange)="onFilterChange()"
    />
  </div>

  <div
    class="file-list"
    [class.file-list--drag-over]="isListDropTarget"
    (click)="onFileListClick($event)"
    (contextmenu)="showEmptyAreaMenu($event)"
    (dragover)="onListDragOver($event)"
    (dragleave)="onListDragLeave()"
    (drop)="onListDrop($event)"
  >
    <div class="file-list-header" *ngIf="!loading && filteredEntries.length">
      <span class="file-name-column">Name</span>
      <span class="file-modified-column">Modified</span>
      <span class="file-permissions-column">Permissions</span>
      <span class="file-size-column">Size</span>
    </div>
    <div *ngIf="loading" class="text-muted p-2">Loading...</div>
    <div *ngIf="errorMessage && !loading" class="text-danger p-2">{{ errorMessage }}</div>
    <div
      *ngFor="let entry of filteredEntries"
      class="file-row"
      draggable="true"
      [class.file-row--cut]="isCut(entry)"
      [class.file-row--selected]="isSelected(entry)"
      [class.file-row--dragging]="draggingEntryPath === entry.path"
      [class.file-row--drag-over]="dragOverEntryPath === entry.path"
      (click)="selectEntry(entry)"
      (dblclick)="open(entry)"
      (contextmenu)="showEntryMenu(entry, $event)"
      (dragstart)="onEntryDragStart($event, entry)"
      (dragend)="onEntryDragEnd()"
      (dragover)="onEntryDragOver($event, entry)"
      (dragleave)="onEntryDragLeave(entry)"
      (drop)="onEntryDrop($event, entry)"
    >
      <i [class]="getIcon(entry)"></i>
      <span class="file-name">{{ entry.name }}</span>
      <span class="file-modified">{{ entry.mtime | date: 'yyyy-MM-dd HH:mm:ss' }}</span>
      <span class="file-permissions">{{ getPermissions(entry) }}</span>
      <span class="file-size">{{ entry.isDirectory ? '' : entry.size + ' B' }}</span>
    </div>
    <div *ngIf="!loading && !filteredEntries.length" class="text-muted p-2">(empty)</div>
  </div>
</div>
