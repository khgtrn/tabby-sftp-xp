<div #panelRoot class="file-panel" tabindex="0" (keydown)="onPanelKeydown($event)">
  <div class="toolbar">
    <button
      class="btn btn-sm history-button"
      [disabled]="!canGoBack()"
      (click)="goBack()"
      title="Back"
    >
      <i class="fas fa-arrow-left"></i>
    </button>
    <button
      class="btn btn-sm history-button"
      [disabled]="!canGoForward()"
      (click)="goForward()"
      title="Forward"
    >
      <i class="fas fa-arrow-right"></i>
    </button>
    <button class="btn btn-sm" (click)="goUp()" title="Parent directory">
      <i class="fas fa-arrow-up"></i>
    </button>
    <button class="btn btn-sm" (click)="refresh()" title="Refresh">
      <i class="fas fa-sync"></i>
    </button>
    <button class="btn btn-sm" (click)="goHome()" title="Home">
      <i class="fas fa-home"></i>
    </button>
    <button class="btn btn-sm" (click)="openBookmarks()" title="Bookmarks">
      <i class="fas fa-star"></i>
    </button>
    <button class="btn btn-sm" (click)="addCurrentPathBookmark()" title="Bookmark this path">
      <i class="fas fa-plus"></i>
    </button>
    <button class="btn btn-sm" (click)="toggleFilter()" title="Filter">
      <i class="fas fa-filter"></i>
    </button>
  </div>

  <div class="path-bar">
    <input
      *ngIf="editingPath !== null; else pathLabel"
      type="text"
      class="form-control form-control-sm"
      [(ngModel)]="editingPath"
      (keydown.enter)="confirmPath()"
      (blur)="confirmPath()"
      autofocus
    />
    <ng-template #pathLabel>
      <div class="path-label" (click)="editPath()">{{ path }}</div>
    </ng-template>
  </div>

  <div class="filter-bar" *ngIf="showFilter">
    <input
      #filterInput
      type="text"
      class="form-control form-control-sm"
      placeholder="Filter..."
      [(ngModel)]="filterText"
      (ngModelChange)="onFilterChange()"
    />
  </div>

  <div
    class="file-list"
    (click)="onFileListClick($event)"
    (contextmenu)="showEmptyAreaMenu($event)"
  >
    <div *ngIf="loading" class="text-muted p-2">Loading...</div>
    <div *ngIf="errorMessage && !loading" class="text-danger p-2">{{ errorMessage }}</div>
    <div
      class="file-row"
      [class.file-row--cut]="isCut(entry)"
      [class.file-row--selected]="isSelected(entry)"
      *ngFor="let entry of filteredEntries"
      (click)="selectEntry(entry)"
      (dblclick)="open(entry)"
      (contextmenu)="showEntryMenu(entry, $event)"
    >
      <i [class]="getIcon(entry)"></i>
      <span class="file-name">{{ entry.name }}</span>
      <span class="file-size" *ngIf="!entry.isDirectory">{{ entry.size }} B</span>
    </div>
    <div *ngIf="!loading && !filteredEntries.length" class="text-muted p-2">(empty)</div>
  </div>
</div>
